[project]
name = "microlab"
version = "0.1.0"
description = "Single-GPU LLM training and evaluation lab"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "gpu: tests that require a CUDA GPU (deselected by the pre-commit hook; run by scripts/check.sh)",
    "exercise: hand-write exercises graded vs the reference oracle (red until you solve them; deselected from the guardrail — run with `pytest -m exercise`)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[project.scripts]
microlab-eval = "microlab.evals.cli:main"
