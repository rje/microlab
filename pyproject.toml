[project]
name = "microlab"
version = "0.1.0"
description = "Single-GPU LLM training and evaluation lab"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[project.scripts]
microlab-eval = "microlab.evals.cli:main"
