# Pre-Certbot nginx site for the Microlab Console.
# Install this as /etc/nginx/sites-available/microlab.rje.ai, symlink it into
# /etc/nginx/sites-enabled/, verify with nginx -t, then run Certbot.

server {
    listen 80;
    listen [::]:80;
    server_name microlab.rje.ai;

    client_max_body_size 25M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        # After Certbot finishes, create Basic Auth before sharing this publicly:
        #
        #   sudo apt-get install apache2-utils
        #   sudo htpasswd -c /etc/nginx/.htpasswd-microlab rje
        #
        # Then uncomment both auth_basic lines and reload nginx.
        #
        # auth_basic "Microlab Console";
        # auth_basic_user_file /etc/nginx/.htpasswd-microlab;

        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_cache_bypass $http_upgrade;
        proxy_ssl_server_name on;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
